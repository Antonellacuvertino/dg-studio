<!doctype html>
<!-- GENERADO por tools/make_beta.py: no editar a mano -->
<html lang="es">
<head>
  <base href="../">
  <script>window.DG_BETA = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DG Studio Beta</title>
  <meta name="description" content="Estudio de producción musical de differentgyal: crea canciones, beats, loops y techno para DJ.">
  <meta name="theme-color" content="#4c0410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DG Beta">
  <link rel="manifest" href="manifest-beta.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="logo"><span class="mark">DG</span> DG Studio</div>
    <div class="top-r">
      <button class="pill always" id="artistBtn" title="Nombre artístico">by <b id="artistName">differentgyal</b></button>
    </div>
  </header>

  <main>
    <section class="view" id="v-create"></section>
    <section class="view" id="v-studio"></section>
    <section class="view" id="v-multi"></section>
    <section class="view" id="v-loops"></section>
    <section class="view" id="v-voice"></section>
    <section class="view" id="v-assistant"></section>
    <section class="view" id="v-ear"></section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="create" class="always"><span class="ti">✍️</span>Crear</button>
    <button data-tab="studio" class="always"><span class="ti">🎛️</span>Estudio</button>
    <button data-tab="multi" class="always"><span class="ti">🎚️</span>Mezcla</button>
    <button data-tab="loops" class="always"><span class="ti">🔁</span>Loops</button>
    <button data-tab="voice" class="always"><span class="ti">🎤</span>Voz</button>
    <button data-tab="assistant" class="always"><span class="ti">🐆</span>Asistente</button>
    <button data-tab="ear" class="always"><span class="ti">👂</span>Oído</button>
  </nav>

  <!-- Grabación (compartida) -->
  <div class="overlay" id="rec" hidden>
    <div class="recbox">
      <div class="pulse">🎙️</div>
      <div class="rectime" id="recTime">0:00</div>
      <div class="muted" id="recHint">Grabando…</div>
      <div class="meter"><div id="recLevel"></div></div>
      <ol class="prompter" id="recPrompter" style="max-height:40vh;overflow:auto;text-align:left"></ol>
      <button class="btn primary big always" id="recStop" style="width:100%;margin-top:12px">■ Detener</button>
    </div>
  </div>

  <div class="overlay" id="busy" hidden>
    <div class="busybox"><div class="spinner"></div><div id="busyText">Trabajando…</div></div>
  </div>

  <div class="overlay bottom" id="sheet" hidden>
    <div class="sheet">
      <h3 id="sheetTitle"></h3>
      <p id="sheetText"></p>
      <div id="sheetBody" class="sheet-opts"></div>
      <button class="sheet-close always" id="sheetCancel">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
